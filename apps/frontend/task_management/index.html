<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>影月系統 任務管理</title>
<style>
:root{--bg:#f4efe6;--ink:#1c1917;--muted:#57534e;--panel:rgba(255,255,255,.78);--line:rgba(28,25,23,.12);--primary:#0f766e;--primary-deep:#134e4a;--soft:#fef3c7;--soft-2:#dcfce7;--shadow:0 24px 60px rgba(28,25,23,.12)}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(circle at top left,rgba(15,118,110,.18),transparent 28%),radial-gradient(circle at 85% 10%,rgba(194,65,12,.18),transparent 24%),linear-gradient(180deg,#f8f5ef 0%,#efe7da 100%);min-height:100vh}.shell{max-width:1240px;margin:0 auto;padding:28px 18px 42px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.hero-main,.hero-side,.panel{background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero-main{padding:24px;background:linear-gradient(135deg,rgba(15,118,110,.95),rgba(28,25,23,.95));color:#fffbeb}.hero-main h1{margin:0;font-size:clamp(1.8rem,4vw,3rem)}.hero-main p{margin:12px 0 0;line-height:1.6;color:rgba(255,251,235,.88)}.hero-side{padding:22px}.hero-side .stamp{font-size:.84rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.hero-side .big{margin-top:12px;font-size:2rem;font-weight:700;color:var(--primary)}.nav{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.nav a{padding:10px 14px;border-radius:999px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.72);border:1px solid var(--line)}.nav a.active{background:var(--ink);color:#fff;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}.panel{padding:18px}.metric{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.value{margin-top:8px;font-size:2rem;font-weight:700}.section-title{margin:0 0 14px;font-size:1rem}.list{display:grid;gap:12px}.item{padding:16px;border-radius:20px;background:rgba(255,255,255,.72);border:1px solid var(--line)}.item strong{display:block;margin-bottom:6px}.meta{color:var(--muted);font-size:.92rem;line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:var(--soft);color:#92400e;font-size:.85rem}.chip.ok{background:var(--soft-2);color:#166534}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.empty{color:var(--muted)}.action-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}.action{padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.8)}.action strong{display:block;margin-bottom:6px}.action code{display:block;font-size:.88rem;white-space:pre-wrap;word-break:break-word;color:var(--primary-deep)}button{font:inherit;border-radius:14px;border:1px solid var(--line);padding:10px 12px;background:var(--primary);color:#fff;border-color:var(--primary);cursor:pointer}.button-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.helper{font-size:.9rem;color:var(--muted)}@media (max-width:860px){.hero,.two-col{grid-template-columns:1fr}}
</style>
</head>
<body><main class="shell"><section class="hero"><div class="hero-main"><h1>任務管理</h1><p>把每日作業、策略輸出、健康檢查與 agent snapshot 整理成一份可直接執行的 runbook。</p></div><aside class="hero-side"><div class="stamp">YingYue Console</div><div class="big" id="heroValue">載入中</div><div class="meta" id="heroMeta">正在同步最新資料</div></aside></section><nav class="nav"><a href="/console/dashboard" >控制面板</a><a href="/console/tasks" class="active">任務管理</a><a href="/console/assistant" >AI 助手</a><a href="/console/monitoring" >系統監控</a></nav><section class="grid" id="taskMetrics"></section><section class="panel"><h2 class="section-title">任務清單</h2><div id="tasks" class="list"></div></section><script>function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}async function copyText(text){try{await navigator.clipboard.writeText(text);return true;}catch(_err){return false;}}function renderTasks(data){const tasks=data.tasks||[];document.getElementById('taskMetrics').innerHTML=[[ '任務數量', tasks.length ],[ '可執行動作', tasks.reduce((sum,item)=>sum+((item.actions||[]).length),0) ],[ '可用產物', tasks.reduce((sum,item)=>sum+((item.outputs||[]).filter(o=>!o.error).length),0) ],[ '任務名稱', data.task_name||'Daily Ops' ]].map(([label,value])=>`<article class="panel"><div class="metric">${escapeHtml(label)}</div><div class="value">${escapeHtml(value)}</div></article>`).join('');document.getElementById('tasks').innerHTML=tasks.map(task=>`<article class="item"><strong>${escapeHtml(task.name)}</strong><div class="meta">類型 ${escapeHtml(task.kind)} · 狀態 ${escapeHtml(task.status)} · 排程 ${escapeHtml(task.schedule)}</div><div class="chips">${(task.outputs||[]).map(o=>`<span class="chip ${o.error?'':'ok'}">${escapeHtml(o.filename||o.type||o.error||'N/A')}</span>`).join('')}</div><div class="action-grid">${(task.actions||[]).map((action,index)=>`<div class="action"><strong>${escapeHtml(action.label)}</strong>${action.command?`<code>${escapeHtml(action.command)}</code>`:`<code>${escapeHtml(location.origin + (action.path||''))}</code>`}<div class="button-row"><button data-copy="${escapeHtml(action.command||location.origin + (action.path||''))}">複製</button></div></div>`).join('')}</div></article>`).join('')||'<div class="empty">尚無任務資料</div>';}async function loadTasks(){const r=await fetch('/tasks/overview',{cache:'no-store'});const d=await r.json();document.getElementById('heroValue').textContent=d.task_name||'Daily Ops';document.getElementById('heroMeta').textContent=d.generated_at||'-';renderTasks(d);}document.addEventListener('click',async e=>{const button=e.target.closest('[data-copy]');if(!button){return;}const value=button.getAttribute('data-copy')||'';const ok=await copyText(value);button.textContent=ok?'已複製':'請手動複製';setTimeout(()=>{button.textContent='複製';},1400);});loadTasks().catch(e=>{document.getElementById('heroValue').textContent='任務載入失敗';document.getElementById('heroMeta').textContent=String(e)});</script></main></body></html>

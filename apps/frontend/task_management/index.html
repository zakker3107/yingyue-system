<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>影月系統 任務管理</title>
<style>
:root{--bg:#f4efe6;--ink:#1c1917;--muted:#57534e;--panel:rgba(255,255,255,.78);--line:rgba(28,25,23,.12);--primary:#0f766e;--soft:#fef3c7;--shadow:0 24px 60px rgba(28,25,23,.12)}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(circle at top left,rgba(15,118,110,.18),transparent 28%),radial-gradient(circle at 85% 10%,rgba(194,65,12,.18),transparent 24%),linear-gradient(180deg,#f8f5ef 0%,#efe7da 100%);min-height:100vh}.shell{max-width:1240px;margin:0 auto;padding:28px 18px 42px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.hero-main,.hero-side,.panel{background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero-main{padding:24px;background:linear-gradient(135deg,rgba(15,118,110,.95),rgba(28,25,23,.95));color:#fffbeb}.hero-main h1{margin:0;font-size:clamp(1.8rem,4vw,3rem)}.hero-main p{margin:12px 0 0;line-height:1.6;color:rgba(255,251,235,.88)}.hero-side{padding:22px}.hero-side .stamp{font-size:.84rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.hero-side .big{margin-top:12px;font-size:2rem;font-weight:700;color:var(--primary)}.nav{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.nav a{padding:10px 14px;border-radius:999px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.72);border:1px solid var(--line)}.nav a.active{background:var(--ink);color:#fff;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}.panel{padding:18px}.metric{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.value{margin-top:8px;font-size:2rem;font-weight:700}.section-title{margin:0 0 14px;font-size:1rem}.list{display:grid;gap:12px}.item{padding:14px;border-radius:18px;background:rgba(255,255,255,.72);border:1px solid var(--line)}.item strong{display:block;margin-bottom:6px}.meta{color:var(--muted);font-size:.92rem;line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:var(--soft);color:#92400e;font-size:.85rem}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.empty{color:var(--muted)}.searchbar{display:flex;gap:10px;margin-top:14px}input,button{font:inherit;border-radius:14px;border:1px solid var(--line);padding:12px 14px}input{flex:1;background:rgba(255,255,255,.86)}button{background:var(--primary);color:#fff;border-color:var(--primary);cursor:pointer}@media (max-width:860px){.hero,.two-col{grid-template-columns:1fr}}
</style>
</head>
<body><main class="shell"><section class="hero"><div class="hero-main"><h1>任務管理</h1><p>檢視每日自動化、健康報表與管線產物，追蹤目前任務與輸出狀態。</p></div><aside class="hero-side"><div class="stamp">YingYue Console</div><div class="big" id="heroValue">載入中</div><div class="meta" id="heroMeta">正在同步最新資料</div></aside></section><nav class="nav"><a href="/console/dashboard" >控制面板</a><a href="/console/tasks" class="active">任務管理</a><a href="/console/assistant" >AI 助手</a><a href="/console/monitoring" >系統監控</a></nav><section class="panel"><h2 class="section-title">任務清單</h2><div id="tasks" class="list"></div></section><script>async function loadTasks(){const r=await fetch('/tasks/overview',{cache:'no-store'});const d=await r.json();document.getElementById('heroValue').textContent=d.task_name||'Daily Ops';document.getElementById('heroMeta').textContent=d.generated_at||'-';document.getElementById('tasks').innerHTML=(d.tasks||[]).map(t=>`<div class="item"><strong>${t.name}</strong><div class="meta">類型 ${t.kind} · 狀態 ${t.status} · 排程 ${t.schedule}</div><div class="chips">${(t.outputs||[]).map(o=>`<span class="chip">${o.filename||o.type||o.error||'N/A'}</span>`).join('')}</div></div>`).join('')||'<div class="empty">尚無任務資料</div>'}loadTasks().catch(e=>{document.getElementById('heroValue').textContent='任務載入失敗';document.getElementById('heroMeta').textContent=String(e)});</script></main></body></html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>影月系統 AI 助手</title>
<style>
:root{--bg:#f4efe6;--ink:#1c1917;--muted:#57534e;--panel:rgba(255,255,255,.78);--line:rgba(28,25,23,.12);--primary:#0f766e;--primary-deep:#134e4a;--accent:#c2410c;--soft:#fef3c7;--soft-2:#ecfccb;--shadow:0 24px 60px rgba(28,25,23,.12)}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(circle at top left,rgba(15,118,110,.18),transparent 28%),radial-gradient(circle at 85% 10%,rgba(194,65,12,.18),transparent 24%),linear-gradient(180deg,#f8f5ef 0%,#efe7da 100%);min-height:100vh}.shell{max-width:1240px;margin:0 auto;padding:28px 18px 42px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.hero-main,.hero-side,.panel{background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero-main{padding:24px;background:linear-gradient(135deg,rgba(15,118,110,.95),rgba(28,25,23,.95));color:#fffbeb}.hero-main h1{margin:0;font-size:clamp(1.8rem,4vw,3rem)}.hero-main p{margin:12px 0 0;line-height:1.6;color:rgba(255,251,235,.88)}.hero-side{padding:22px}.hero-side .stamp{font-size:.84rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.hero-side .big{margin-top:12px;font-size:2rem;font-weight:700;color:var(--primary)}.nav{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.nav a{padding:10px 14px;border-radius:999px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.72);border:1px solid var(--line)}.nav a.active{background:var(--ink);color:#fff;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}.panel{padding:18px}.metric{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.value{margin-top:8px;font-size:2rem;font-weight:700}.section-title{margin:0 0 14px;font-size:1rem}.list{display:grid;gap:12px}.item{padding:14px;border-radius:18px;background:rgba(255,255,255,.72);border:1px solid var(--line)}.item strong{display:block;margin-bottom:6px}.meta{color:var(--muted);font-size:.92rem;line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:var(--soft);color:#92400e;font-size:.85rem}.chip.ok{background:var(--soft-2);color:#166534}.two-col{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;margin-top:18px}.empty{color:var(--muted)}.searchbar{display:flex;gap:10px;margin-top:14px}input,button,textarea{font:inherit;border-radius:14px;border:1px solid var(--line);padding:12px 14px}input,textarea{width:100%;background:rgba(255,255,255,.86)}textarea{min-height:180px;resize:vertical;line-height:1.6}button{background:var(--primary);color:#fff;border-color:var(--primary);cursor:pointer}.button-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.button-row button.secondary{background:#fff;color:var(--primary-deep);border-color:rgba(19,78,74,.2)}.prompt-card{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}.prompt-card:hover{transform:translateY(-2px);border-color:rgba(15,118,110,.3);box-shadow:0 16px 30px rgba(15,118,110,.12)}.workspace{display:grid;gap:14px}.workspace-note{padding:12px 14px;border-radius:16px;background:rgba(15,118,110,.08);color:var(--primary-deep);font-size:.95rem;line-height:1.5}.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.mini{padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.62);border:1px solid var(--line)}.mini strong{display:block;margin-bottom:6px}.mini .value{font-size:1.15rem;margin-top:0}.helper{font-size:.9rem;color:var(--muted)}@media (max-width:860px){.hero,.two-col{grid-template-columns:1fr}}
</style>
</head>
<body><main class="shell"><section class="hero"><div class="hero-main"><h1>AI 助手</h1><p>把最新新聞、趨勢和報表狀態組成可直接發問的工作台，讓每日判讀更接近真正的 copilot 操作面板。</p></div><aside class="hero-side"><div class="stamp">YingYue Console</div><div class="big" id="heroValue">載入中</div><div class="meta" id="heroMeta">正在同步最新資料</div></aside></section><nav class="nav"><a href="/console/dashboard" >控制面板</a><a href="/console/tasks" >任務管理</a><a href="/console/assistant" class="active">AI 助手</a><a href="/console/monitoring" >系統監控</a></nav><section class="grid" id="assistantMetrics"></section><section class="two-col"><section class="panel"><h2 class="section-title">建議提問</h2><div id="prompts" class="list"></div></section><section class="panel workspace"><div><h2 class="section-title">Prompt 工作台</h2><div class="workspace-note" id="focusNote">正在整理目前建議焦點...</div></div><textarea id="promptEditor" placeholder="點選左側建議提問，或自行組合成分析請求。"></textarea><div class="button-row"><button id="copyPromptBtn">複製 Prompt</button><button id="clearPromptBtn" class="secondary">清空</button></div><div class="helper">建議流程：先點一個建議提問，再補上你要的輸出格式，例如「請用 3 點摘要 + 2 個風險 + 1 個行動建議」。</div></section></section><section class="two-col"><section class="panel"><h2 class="section-title">哲學搜尋</h2><div class="searchbar"><input id="query" placeholder="輸入 ethics、Kant、German、Modern...；留空可瀏覽條目"><button id="searchBtn">搜尋</button></div><div class="helper">可搜尋 title、author、school、era、summary、keywords。現在以英文條目為主；留空可直接查看目前哲學條目。</div><div id="searchResults" class="list" style="margin-top:14px;"></div></section><section class="panel"><h2 class="section-title">助手上下文</h2><div id="assistantSummary" class="list"></div></section></section><section class="panel" style="margin-top:18px;"><h2 class="section-title">報表可用狀態</h2><div id="reportReadiness" class="list"></div></section><script>const state={prompts:[],context:null};function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}function buildFallbackPrompts(data){const summary=data?.summary||{};const latest=summary.latest_news||{};const trends=summary.top_trends||[];const prompts=[];if(latest.title){prompts.push(`請從〈${latest.title}〉整理 3 個重點、2 個風險、1 個下一步行動。`);}for(const trend of trends.slice(0,2)){if(trend?.metric_name){prompts.push(`請解釋趨勢 ${trend.metric_name} 的意義、風險與可執行應對。`);}}prompts.push('請根據目前新聞、趨勢與報表，整理今天最值得追蹤的 3 件事。');return [...new Set(prompts.filter(Boolean))];}function fillPrompt(text){const editor=document.getElementById('promptEditor');editor.value=text;editor.focus();editor.setSelectionRange(editor.value.length,editor.value.length);}async function copyPrompt(){const text=document.getElementById('promptEditor').value.trim();if(!text){document.getElementById('focusNote').textContent='目前沒有可複製的 prompt。';return;}try{await navigator.clipboard.writeText(text);document.getElementById('focusNote').textContent='Prompt 已複製，可直接貼到 Copilot、Codex 或其他聊天視窗。';}catch(_err){document.getElementById('focusNote').textContent='瀏覽器無法直接複製，請手動選取工作台內容。';}}function renderPrompts(prompts){document.getElementById('prompts').innerHTML=prompts.map((p,index)=>`<button class="item prompt-card" data-prompt-index="${index}"><strong>建議 ${index+1}</strong><div class="meta">${escapeHtml(p)}</div></button>`).join('')||'<div class="item empty">目前沒有建議提問</div>';}function renderSummary(data){const summary=data.summary||{};const latest=summary.latest_news||{};const trends=summary.top_trends||[];const ready=summary.ready_reports||[];const missing=summary.missing_reports||[];document.getElementById('assistantMetrics').innerHTML=[[ '建議提問', data.prompt_count??0 ],[ '可用報表', ready.length ],[ '缺失報表', missing.length ],[ '首要焦點', data.focus||'未設定' ]].map(([label,value])=>`<article class="panel"><div class="metric">${escapeHtml(label)}</div><div class="value">${escapeHtml(value)}</div></article>`).join('');document.getElementById('assistantSummary').innerHTML=`<div class="mini"><strong>最新新聞</strong><div class="meta">${escapeHtml(latest.title||'無資料')}</div><div class="helper">${escapeHtml([latest.source,latest.topic,latest.published_at].filter(Boolean).join(' · ')||'等待資料')}</div></div><div class="mini"><strong>關鍵趨勢</strong><div class="meta">${escapeHtml(trends.map(item=>item.metric_name).join('、')||'無資料')}</div></div><div class="mini"><strong>下一步建議</strong><div class="meta">${escapeHtml(data.focus||'追蹤最新訊號')}</div></div>`;document.getElementById('reportReadiness').innerHTML=`<div class="status-grid">${ready.map(item=>`<div class="mini"><strong>${escapeHtml(item.name)}</strong><div class="meta">${escapeHtml(item.filename||item.type||'available')}</div><div class="chips"><span class="chip ok">可用</span></div></div>`).join('')}${missing.map(item=>`<div class="mini"><strong>${escapeHtml(item.name)}</strong><div class="meta">${escapeHtml(item.error||'not ready')}</div><div class="chips"><span class="chip">待補</span></div></div>`).join('')}</div>`||'<div class="item empty">尚無報表資訊</div>';document.getElementById('focusNote').textContent=`目前焦點：${data.focus||'追蹤最新訊號'}`;}async function loadAssistant(){const r=await fetch('/assistant/context',{cache:'no-store'});const d=await r.json();state.context=d;const serverPrompts=Array.isArray(d.suggested_prompts)?d.suggested_prompts:[];state.prompts=serverPrompts.length?serverPrompts:buildFallbackPrompts(d);document.getElementById('heroValue').textContent=`${state.prompts.length} 個建議操作`;document.getElementById('heroMeta').textContent=d.generated_at||'-';renderPrompts(state.prompts);renderSummary(d);if(state.prompts[0]){fillPrompt(state.prompts[0]);}else{document.getElementById('focusNote').textContent='目前沒有現成 prompt，請先從右側摘要組合需求。';}searchPhilosophy({silent:true});}function renderPhilosophyResults(items,query){const label=query?`查詢：${escapeHtml(query)}`:'目前哲學條目';const cards=(items||[]).map(i=>`<div class="item"><strong>${escapeHtml(i.title||'-')}</strong><div class="meta">${escapeHtml([i.author||'-',i.school||'-',i.era||'-'].filter(Boolean).join(' · '))}</div><div class="meta">${escapeHtml(i.summary||'')}</div></div>`).join('');if(cards){document.getElementById('searchResults').innerHTML=`<div class="helper">${label}</div>${cards}`;return;}const emptyMessage=query?`查無結果。可改試 author、school、era，例如 Kant、German、Modern。`:'目前沒有可用的哲學條目。';document.getElementById('searchResults').innerHTML=`<div class="item empty">${escapeHtml(emptyMessage)}</div>`;}async function searchPhilosophy(options={}){const q=document.getElementById('query').value.trim();if(q.length===1){document.getElementById('searchResults').innerHTML='<div class="item">若有輸入內容，請至少輸入 2 個字元；或直接留空瀏覽條目。</div>';return;}const url=q?`/philosophy/search?q=${encodeURIComponent(q)}`:'/philosophy/search';const r=await fetch(url,{cache:'no-store'});const d=await r.json();if(!r.ok){document.getElementById('searchResults').innerHTML=`<div class="item">${escapeHtml(d.error||'搜尋失敗')}</div>`;return;}renderPhilosophyResults(Array.isArray(d)?d:[],q);if(!options.silent&&q){document.getElementById('focusNote').textContent=`已完成哲學搜尋：${q}`;}}document.addEventListener('click',e=>{const promptButton=e.target.closest('[data-prompt-index]');if(promptButton){const index=Number(promptButton.dataset.promptIndex);fillPrompt(state.prompts[index]||'');return;}if(e.target&&e.target.id==='searchBtn'){searchPhilosophy();return;}if(e.target&&e.target.id==='copyPromptBtn'){copyPrompt();return;}if(e.target&&e.target.id==='clearPromptBtn'){fillPrompt('');document.getElementById('focusNote').textContent='工作台已清空，可重新組合你的提問。';}});document.getElementById('query').addEventListener('keydown',e=>{if(e.key==='Enter'){searchPhilosophy();}});loadAssistant().catch(e=>{document.getElementById('heroValue').textContent='助手資料載入失敗';document.getElementById('heroMeta').textContent=String(e)});</script></main></body></html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>影月系統 控制面板</title>
<style>
:root{--bg:#f4efe6;--ink:#1c1917;--muted:#57534e;--panel:rgba(255,255,255,.78);--line:rgba(28,25,23,.12);--primary:#0f766e;--primary-deep:#134e4a;--accent:#c2410c;--soft:#fef3c7;--soft-2:#dcfce7;--soft-3:#e0f2fe;--shadow:0 24px 60px rgba(28,25,23,.12)}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink);background:radial-gradient(circle at top left,rgba(15,118,110,.18),transparent 28%),radial-gradient(circle at 85% 10%,rgba(194,65,12,.18),transparent 24%),linear-gradient(180deg,#f8f5ef 0%,#efe7da 100%);min-height:100vh}.shell{max-width:1240px;margin:0 auto;padding:28px 18px 42px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.hero-main,.hero-side,.panel{background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.hero-main{padding:24px;background:linear-gradient(135deg,rgba(15,118,110,.95),rgba(28,25,23,.95));color:#fffbeb}.hero-main h1{margin:0;font-size:clamp(1.8rem,4vw,3rem)}.hero-main p{margin:12px 0 0;line-height:1.6;color:rgba(255,251,235,.88)}.hero-side{padding:22px}.hero-side .stamp{font-size:.84rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.hero-side .big{margin-top:12px;font-size:2rem;font-weight:700;color:var(--primary)}.nav{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.nav a{padding:10px 14px;border-radius:999px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.72);border:1px solid var(--line)}.nav a.active{background:var(--ink);color:#fff;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}.panel{padding:18px}.metric{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.value{margin-top:8px;font-size:2rem;font-weight:700}.section-title{margin:0 0 14px;font-size:1rem}.list{display:grid;gap:12px}.item{padding:14px;border-radius:18px;background:rgba(255,255,255,.72);border:1px solid var(--line)}.item strong{display:block;margin-bottom:6px}.meta{color:var(--muted);font-size:.92rem;line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:var(--soft);color:#92400e;font-size:.85rem}.chip.ok{background:var(--soft-2);color:#166534}.chip.info{background:var(--soft-3);color:#0c4a6e}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.empty{color:var(--muted)}.action-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.action-card{padding:16px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.82)}.action-card strong{display:block;margin-bottom:6px}.action-card code{display:block;margin-top:8px;color:var(--primary-deep);font-size:.88rem;white-space:pre-wrap;word-break:break-word}.button-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button,a.button-link{font:inherit;border-radius:14px;border:1px solid var(--line);padding:10px 12px;background:var(--primary);color:#fff;border-color:var(--primary);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.button-link.secondary,button.secondary{background:#fff;color:var(--primary-deep);border-color:rgba(19,78,74,.2)}.helper{font-size:.9rem;color:var(--muted)}@media (max-width:860px){.hero,.two-col{grid-template-columns:1fr}}
</style>
</head>
<body><main class="shell"><section class="hero"><div class="hero-main"><h1>控制面板</h1><p>集中查看每日產出、關鍵趨勢與核心報表，並從首頁直接跳進任務 runbook、AI prompt 工作台與監控快照。</p></div><aside class="hero-side"><div class="stamp">YingYue Console</div><div class="big" id="heroValue">載入中</div><div class="meta" id="heroMeta">正在同步最新資料</div></aside></section><nav class="nav"><a href="/console/dashboard" class="active">控制面板</a><a href="/console/tasks" >任務管理</a><a href="/console/assistant" >AI 助手</a><a href="/console/monitoring" >系統監控</a></nav><section class="grid" id="metrics"></section><section class="panel" style="margin-top:18px;"><h2 class="section-title">快捷操作</h2><div id="quickActions" class="action-grid"></div></section><section class="two-col"><section class="panel"><h2 class="section-title">最新新聞</h2><div id="latestNews" class="item empty">載入中...</div></section><section class="panel"><h2 class="section-title">報表輸出</h2><div id="reports" class="list"></div></section></section><section class="two-col"><section class="panel"><h2 class="section-title">前五名趨勢</h2><div id="trends" class="list"></div></section><section class="panel"><h2 class="section-title">今日焦點</h2><div id="focusPanel" class="list"></div></section></section><script>const state={assistant:null,tasks:null};function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}async function copyText(text){try{await navigator.clipboard.writeText(text);return true;}catch(_err){return false;}}function renderQuickActions(){const focus=state.assistant?.focus||'追蹤最新訊號';const firstPrompt=(state.assistant?.suggested_prompts||[])[0]||'請總結目前最重要的系統訊號與下一步。';const runCommand=(state.tasks?.tasks||[]).flatMap(task=>task.actions||[]).find(action=>action.command)?.command||'python scripts\\run_mvp.py';const cards=[{title:'執行 Daily Ops',meta:'直接複製當前推薦命令，快速補跑主要流程。',chip:'Runbook',chipClass:'ok',code:runCommand,copy:runCommand,link:'/console/tasks',linkLabel:'打開任務頁'},{title:'打開 AI 助手',meta:`目前焦點：${focus}`,chip:'Prompt',chipClass:'info',code:firstPrompt,copy:firstPrompt,link:'/console/assistant',linkLabel:'進入助手頁'},{title:'查看監控快照',meta:'快速檢視健康狀態、事件嚴重度與最近告警。',chip:'Monitor',chipClass:'',code:`${location.origin}/monitor/snapshot`,copy:`${location.origin}/monitor/snapshot`,link:'/console/monitoring',linkLabel:'打開監控頁'}];document.getElementById('quickActions').innerHTML=cards.map(card=>`<article class="action-card"><strong>${escapeHtml(card.title)}</strong><div class="meta">${escapeHtml(card.meta)}</div><div class="chips"><span class="chip ${escapeHtml(card.chipClass)}">${escapeHtml(card.chip)}</span></div><code>${escapeHtml(card.code)}</code><div class="button-row"><button data-copy="${escapeHtml(card.copy)}">複製</button><a class="button-link secondary" href="${escapeHtml(card.link)}">${escapeHtml(card.linkLabel)}</a></div></article>`).join('');}function renderStation(d){document.getElementById('heroValue').textContent=`${d.counts?.news_count??0} 則新聞`;document.getElementById('heroMeta').textContent=d.generated_at||'-';const m=[['新聞總數',d.counts?.news_count??0],['趨勢快照',d.counts?.trend_count??0],['哲學條目',d.counts?.philosophy_count??0],['活躍事件',d.counts?.active_event_count??0]];document.getElementById('metrics').innerHTML=m.map(([l,v])=>`<article class="panel"><div class="metric">${l}</div><div class="value">${v}</div></article>`).join('');const n=d.latest_news;document.getElementById('latestNews').innerHTML=n?`<strong>${escapeHtml(n.title)}</strong><div class="meta">${escapeHtml([n.source||'-',n.topic||'-',n.published_at||'-'].join(' · '))}</div>`:'<div class="empty">尚無新聞資料</div>';document.getElementById('trends').innerHTML=(d.top_trends||[]).map(i=>`<div class="item"><strong>${escapeHtml(i.metric_name)}</strong><div class="meta">值 ${Number(i.metric_value).toFixed(2)} · ${escapeHtml(i.captured_at||'-')}</div></div>`).join('')||'<div class="empty">尚無趨勢資料</div>';document.getElementById('reports').innerHTML=Object.entries(d.reports||{}).map(([n,r])=>`<div class="item"><strong>${escapeHtml(n)}</strong><div class="meta">${escapeHtml(r.filename||r.error||'-')}</div><div class="meta">${escapeHtml(r.updated_at||r.path||'')}</div></div>`).join('');}function renderFocus(){const focus=state.assistant?.focus||'追蹤最新訊號';const prompts=state.assistant?.suggested_prompts||[];document.getElementById('focusPanel').innerHTML=`<div class="item"><strong>首要焦點</strong><div class="meta">${escapeHtml(focus)}</div></div>${prompts.slice(0,2).map(prompt=>`<div class="item"><strong>建議提問</strong><div class="meta">${escapeHtml(prompt)}</div></div>`).join('')}`;}async function loadDashboard(){const [stationRes,assistantRes,tasksRes]=await Promise.all([fetch('/station/summary',{cache:'no-store'}),fetch('/assistant/context',{cache:'no-store'}),fetch('/tasks/overview',{cache:'no-store'})]);const station=await stationRes.json();state.assistant=await assistantRes.json();state.tasks=await tasksRes.json();renderStation(station);renderFocus();renderQuickActions();}document.addEventListener('click',async e=>{const button=e.target.closest('[data-copy]');if(!button){return;}const value=button.getAttribute('data-copy')||'';const ok=await copyText(value);button.textContent=ok?'已複製':'請手動複製';setTimeout(()=>{button.textContent='複製';},1400);});loadDashboard().catch(e=>{document.getElementById('heroValue').textContent='載入失敗';document.getElementById('heroMeta').textContent=String(e)});</script></main></body></html>
